   正式 Room 1–6（r1–r6）、備用 Backup 1–6（b1–b6）、測試 Test 1–6（t1–t6，對應 Room 1–6） */
const MAIN=[1,2,3,4,5,6].map(n=>'r'+n), BACKUP=[1,2,3,4,5,6].map(n=>'b'+n), TEST=[1,2,3,4,5,6].map(n=>'t'+n);
const ALL=[...MAIN,...BACKUP,...TEST];
const roomName=id=>({r:'Room ',b:'Backup ',t:'Test '})[id[0]]+id.slice(1);
const slotOf=id=>+id.slice(1)-1;        // Room n、Backup n、Test n 都使用第 n 份答案
const seedOf=id=>+id.slice(1);           // 選項順序也和同號房間一樣

/* ===== 工具 ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function opt(q,i){const a=(i<5?Q[q].o[i]:EXTRA[i-5]).split('|');return{en:a[0],zh:a[1],ja:a[2],w:a[3].split(';'),ask:a[4]}}
function shuffle(arr,seed){const a=arr.slice();let x=seed%2147483647||7;for(let i=a.length-1;i>0;i--){x=(x*16807)%2147483647;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const order=(r,q)=>shuffle([0,1,2,3,4],seedOf(r)*7919+(q+1)*104729).concat([5,6]);
const L=i=>String.fromCharCode(65+i);
const tw=i=>'TW'+(i+1);
const chips=(arr,cls='')=>`<div class="chips">${arr.map(w=>{const a=Array.isArray(w)?w:[w,...(TR[w]||[])];return `<span class="chip ${cls}"><span class="ce E">${esc(a[0])}</span>${a[1]?`<span class="tl"><span class="L zh">${esc(a[1])}</span><span class="L ja">${esc(a[2])}</span></span>`:''}</span>`}).join('')}</div>`;
const B=(text,act,arg='',cls='',dis=false,cf='')=>`<button class="${cls}" data-act="${act}" data-a="${esc(arg)}" ${cf?`data-cf="${esc(cf)}"`:''} ${dis?'disabled':''}>${text}</button>`;
function copyText(t,msg){const fb=()=>showText(t);try{navigator.clipboard.writeText(t).then(()=>toast(msg||'已複製'),fb)}catch(e){fb()}}
function showText(t){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m)}
 m.innerHTML=`<div class="mbox"><b>請全選後複製（Ctrl/⌘ + C）</b><textarea readonly>${esc(t)}</textarea><button class="primary" onclick="document.getElementById('modal').remove()">關閉</button></div>`;
 const ta=m.querySelector('textarea');ta.focus();ta.select()}
function showSyncWarning(message){
 let e=document.getElementById('sync-warning');
 if(!e){e=document.createElement('div');e.id='sync-warning';e.style.cssText='position:fixed;bottom:12px;left:12px;right:12px;max-width:720px;margin:auto;background:#fff0ce;border:2px solid #d58b6f;border-radius:12px;padding:12px 16px;z-index:999;font-size:15px;box-shadow:0 6px 20px #0002';document.body.appendChild(e)}
 e.textContent=message;
}
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=t;el.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',2200)}
const preset=(r,q)=>{const sl=slotOf(r);return PRESET[sl]&&PRESET[sl][q]};

let rooms={}, db=null, loaded=false;
const KEY='ymw-v43';

const EMBED=P.get('embed')==='1';
function normId(v){v=String(v||'r1').toLowerCase();if(/^\d+$/.test(v))v='r'+v;return ALL.includes(v)?v:'r1'}
let room=normId(P.get('r'));
let role=P.get('role')||'home';          // home | host | tw | teacher | test

function S(r=room){const s=rooms[r]||{};const seats=s.seats||{};return{seats,live:!!s.live,q:s.q??-1,p:s.p||0,hp:s.hp??-1,hg:s.hg??-1,pk:s.pk||{},gs:s.gs||{},help:s.help||{},rt:s.rt??-1,rtok:s.rtok||'',qzOn:!!s.qzOn,qz:s.qz||{},fc:s.fc??-1,sh:s.sh||{},turn:s.turn||0,card:s.card||'',used:s.used||{},rounds:s.rounds||0,done:s.done||{},tv:s.tv||{},ao:s.ao??-1,aqi:s.aqi??-1,asked:s.asked||{},examples:s.examples||{},understand:s.understand||{},depth:s.depth||0,explore:s.explore??-1}}
function setPath(obj,path,val){const k=path.split('/');let o=obj;for(let i=0;i<k.length-1;i++){if(typeof o[k[i]]!=='object'||o[k[i]]===null)o[k[i]]={};o=o[k[i]]}if(val===null)delete o[k.at(-1)];else o[k.at(-1)]=val}
function fresh(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return rooms}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}render()}
function upd(obj,r=room){
 if(db){const o={};for(const k in obj)o[`${BASE}/rooms/${r}/${k}`]=obj[k];db.ref().update(o);return}
 rooms=fresh();   // 先讀最新資料再修改，避免多個分頁互相覆蓋
 for(const k in obj)setPath(rooms,`${r}/${k}`,obj[k]);
 saveLocal();
}
function wipe(ids){
 if(db){const o={};ids.forEach(r=>o[`${BASE}/rooms/${r}`]=null);db.ref().update(o);return}

}
function devId(){if(P.get('dev'))return P.get('dev');const st=db?localStorage:sessionStorage;let d=st.getItem('ymw-dev');if(!d){d='d'+Math.random().toString(36).slice(2,10);st.setItem('ymw-dev',d)}return d}

/* 座位：不限人數，依進入順序編號；離開的號碼會由新進來的人補上 */
function pickSeat(cur,dev){cur=cur||{};for(const k in cur)if(cur[k]&&cur[k].d===dev){cur[k].on=true;cur[k].t=Date.now();return cur}
 for(let i=0;;i++)if(!cur['s'+i]){cur['s'+i]={d:dev,on:true,t:Date.now()};return cur}}
function seatOf(seats,dev){for(const k in seats||{})if(seats[k]&&seats[k].d===dev)return +k.slice(1);return -1}
let claiming=false;
function claim(r=room,dev=devId()){
 if(claiming)return;claiming=true;me=-1;
 if(db){db.ref(`${BASE}/rooms/${r}/seats`).transaction(cur=>pickSeat(cur,dev)).then(res=>{claiming=false;me=seatOf(res.snapshot.val(),dev);presence();render()});return}
 rooms=fresh();const seats=pickSeat(JSON.parse(JSON.stringify(rooms[r]?.seats||{})),dev);me=seatOf(seats,dev);claiming=false;
 upd({['seats/s'+me]:seats['s'+me]},r);
}
function presence(){
 if(!db||me<0)return;const ref=db.ref(`${BASE}/rooms/${room}/seats/s${me}/on`);
 ref.set(true);ref.onDisconnect().set(false);
}
function online(s,i){const x=s.seats['s'+i];if(!x)return false;if(x.on===false)return false;return db?true:(Date.now()-(x.t||0)<25000)}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function init(){
 // Render a usable page immediately; Firebase's first snapshot may take time or fail.
 try{rooms=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){rooms={}}

 render();

  try{
   await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
   await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
   firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();
   db.ref(BASE+'/rooms').on('value',snap=>{rooms=snap.val()||{};loaded=true;render()}, err=>{
      // Don't leave the main content blank if database permissions/network fail.
      console.error('Firebase database read failed:',err);
      db=null; loaded=true; render();
      showSyncWarning('Firebase 無法讀取房間資料，已切換為本機試用模式。請確認資料庫規則及網路連線。');
    });
   db.ref('.info/connected').on('value',snap=>{if(snap.val()===true)presence()});
   if(role==='tw')claim();
   return;
  }catch(e){alert('Firebase 連線失敗，改用單機試用模式。');db=null}
 }
 try{rooms=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){rooms={}}
 loaded=true;
 window.addEventListener('storage',e=>{if(e.key===KEY){try{rooms=JSON.parse(e.newValue)||{};render()}catch(_){}}});
 if(role==='tw'){claim();
  setInterval(()=>{rooms=fresh();if(me>=0&&rooms[room]?.seats?.['s'+me]?.d===devId()){rooms[room].seats['s'+me].t=Date.now();rooms[room].seats['s'+me].on=true;saveLocal()}},8000);
  window.addEventListener('pagehide',()=>{rooms=fresh();if(me>=0&&rooms[room]?.seats?.['s'+me]?.d===devId()){rooms[room].seats['s'+me].on=false;try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}}});}
 if(role==='host'||role==='teacher'||role==='test')setInterval(render,10000);
 render();
}
function setURL(){if(EMBED)return;const u=new URLSearchParams();if(role!=='home'){u.set('role',role);if(role!=='teacher')u.set('r',room)}history.replaceState(null,'','?'+u)}
function go(r,ro){
 if(ro==='test'||ro==='teacher'||ro==='home'){location.search=ro==='home'?'':`?role=${ro}${ro==='test'&&r?'&r='+r:''}`;return}
 location.search=`?role=${ro}&r=${r}`;   // 重新載入，確保座位與連線狀態正確
}

/* ===== 計算 ===== */
function present(s){return Object.keys(s.seats).filter(k=>s.seats[k]).map(k=>+k.slice(1)).sort((a,b)=>a-b)}
function majority(s){const c={};present(s).forEach(i=>{const v=s.pk['s'+i];if(v!=null)c[v]=(c[v]||0)+1});const m=Math.max(0,...Object.values(c));return m?Object.keys(c).filter(k=>c[k]===m).map(Number):[]}
function shareOrder(s){return present(s).sort((a,b)=>Number(s.pk['s'+a]===s.hp)-Number(s.pk['s'+b]===s.hp))}
function quizOf(r,q){const p=preset(r,q);if(!p||!p.quiz)return null;const opts=shuffle([0,1,2,3],(seedOf(r)+3)*31+q*17);return{q:p.quiz[0],o:opts.map(i=>p.quiz[i+1]),a:opts.indexOf(0)}}

/* ===== 動作 ===== */
const ACT={
 go:a=>{const[r,ro]=a.split(',');go(r,ro)},
 kick:a=>{const[r,i]=a.split(',');const s=S(r);
   const o={};['seats','pk','gs','qz','sh','help','understand','examples'].forEach(k=>o[`${k}/s${i}`]=null);if(s.rt===+i)o.rt=-1;if(s.fc===+i)o.fc=-1;upd(o,r)},
 live:()=>upd({live:true}),
 start:a=>{const q=+a,p=preset(room,q);upd({tv:null,ao:-1,aqi:-1,asked:null,examples:null,understand:null,depth:0,explore:-1,q,p:1,hp:p?p.pick:-1,hg:-1,pk:null,gs:null,help:null,rt:-1,rtok:'',qzOn:false,qz:null,fc:-1,sh:null,turn:0,card:'',used:null,rounds:0})},
 hpick:a=>upd({hp:+a}),
 hguess:a=>upd({hg:+a}),
 pick:a=>{const s=S();upd({[(s.p===1?'pk/s':'gs/s')+me]:+a})},   // 第1步選答案、第3步猜答案
 next:()=>{const s=S();upd({p:s.p+1,ao:-1,aqi:-1})},
 back:()=>{const s=S();if(s.p>1)upd({p:s.p-1})},
 sig:a=>{lastCheck=a;upd({['help/s'+me]:a})},
 clearSig:()=>upd({help:null}),
 retell:()=>{const s=S();const on=present(s).filter(i=>online(s,i));const ids=(on.length?on:present(s)).filter(i=>i!==s.rt);const pick=ids[Math.floor(Math.random()*ids.length)]??present(s)[0]??-1;upd({rt:pick,rtok:''})},
 rtok:a=>upd({rtok:a}),
 quizOn:()=>upd({qzOn:true}),
 quiz:a=>upd({['qz/s'+me]:+a}),
 focus:a=>upd({fc:+a}),
 shared:()=>{const s=S();const sh={...s.sh,['s'+s.fc]:true};const nx=shareOrder(s).find(i=>!sh['s'+i]);upd({['sh/s'+s.fc]:true,fc:nx??-1})},
 draw:()=>{const s=S();const host=s.turn%(present(s).length+1)===0;const deck=host?Q[s.q].jt.concat(MORE_JT):Q[s.q].tj.concat(MORE_TJ);const pref=host?'j':'t';
   let i=deck.findIndex((_,k)=>!s.used[pref+k]);if(i<0)i=Math.floor(Math.random()*deck.length);upd({card:deck[i],['used/'+pref+i]:true})},
 pass:()=>{const s=S();upd({turn:(s.turn+1)%(present(s).length+1),card:'',rounds:s.rounds+1})},
 saveExample:()=>{const el=activeExampleInput||document.querySelector('.example-input');if(el&&me>=0)upd({['examples/s'+me]:el.value.trim().slice(0,160)})},
 understand:a=>{if(me>=0)upd({['understand/s'+me]:a})},
 setDepth:a=>upd({depth:+a}),
 explore:a=>upd({explore:+a}),
 finish:()=>{const s=S();upd({['done/q'+s.q]:true,q:-1,p:0,tv:null})},
 reset:a=>{wipe([a]);toast(`已重置 ${roomName(a)}`)},
 resetGroup:a=>{const ids=a==='main'?MAIN:a==='backup'?BACKUP:a==='test'?TEST:ALL;const nm={main:'所有正式房間 Room 1–6',backup:'所有備用房間 Backup 1–6',test:'所有測試房間 Test 1–6',all:'全部房間（正式＋備用＋測試）'}[a];
   wipe(ids);toast(`已重置${nm}`)},
 goHome:()=>go(room,'home'),
 copy:a=>copyText(a,'已複製連結')
};
let armed='',armedUntil=0,activeExampleInput=null;

 if(b.dataset.cf){const key=b.dataset.act+'|'+b.dataset.a;
  if(!(armed===key&&Date.now()<armedUntil)){armed=key;armedUntil=Date.now()+4000;const orig=b.innerHTML;b.innerHTML=esc(b.dataset.cf);b.classList.add('armed');

/* --- 測試房間：同一個畫面同時操作日本主持人與多台台灣裝置（不用 iframe，任何瀏覽器都能用） --- */
let personas=[], inPersona=false, pendingRender=false;
function withPersona(p,fn){
 const sv=[role,me,lastCheck];role=p.role;me=p.me??-1;lastCheck=p.lc||null;inPersona=true;
 let out;try{out=fn()}finally{p.lc=lastCheck;role=sv[0];me=sv[1];lastCheck=sv[2];inPersona=false}
 if(pendingRender){pendingRender=false;render()}
 return out;
}
function newTw(n){return{role:'tw',dev:`${room}-dev${n}-${Math.random().toString(36).slice(2,6)}`,me:-1,lc:null,label:'台灣裝置 '+n}}
function initTest(){
 personas=[{role:'host',label:'🇯🇵 日本主持人 Host'}];
 for(let n=1;n<=3;n++)personas.push({...newTw(n),dev:`${room}-dev${n}`});
 if(!FIREBASE_CONFIG)setInterval(()=>{rooms=fresh();let ch=false;personas.forEach(p=>{const x=p.role==='tw'&&p.me>=0&&rooms[room]?.seats?.['s'+p.me];if(x&&x.d===p.dev){x.t=Date.now();x.on=true;ch=true}});if(ch)saveLocal()},8000);
}
function claimP(p){
 if(p.claiming)return;p.claiming=true;
 if(db){db.ref(`${BASE}/rooms/${room}/seats`).transaction(cur=>pickSeat(cur,p.dev)).then(res=>{p.me=seatOf(res.snapshot.val(),p.dev);p.claiming=false;render()});return}
 rooms=fresh();const seats=pickSeat(JSON.parse(JSON.stringify(rooms[room]?.seats||{})),p.dev);p.me=seatOf(seats,p.dev);
 setPath(rooms,`${room}/seats/s${p.me}`,seats['s'+p.me]);try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}
 p.claiming=false;
}
let autoSim=true;   // 測試房間：TW2 以後的裝置自動作答，只要操作主持人和 TW1 就能一路測試
ACT.sim=()=>{autoSim=!autoSim;render()};
function simulate(){
 if(!autoSim)return;const s=S();if(!s.live||s.q<0)return;
 personas.forEach((p,idx)=>{if(p.role!=='tw'||p.me<0||idx<2)return;const k='s'+p.me;
  const rnd=()=>order(room,s.q)[Math.floor(Math.random()*7)];

   <h3>${T('② 說說你的答案','② 自分の答えを話そう','② Talk about your answer')}</h3>${MC([['Now, I will tell you about my answer. Please listen carefully.','現在我來說說我的答案，請仔細聽。','では、私の答えについて話します。よく聞いてください。'],['If you don’t understand, please tap the button on your screen.','聽不懂的話，請按螢幕上的按鈕。','わからなかったら、画面のボタンを押してね。']])}<p class="muted">${T('台灣同學的畫面不會出現你的句子。不要用唸的，看著關鍵字用自己的話說。','台湾の画面には答えの文は出ません。読まずに、キーワードを見ながら自分の言葉で話そう。','Your sentences are NOT on the Taiwanese screens. Don’t read—look at the keywords and speak in your own words.')}</p>

   ${p?`<details data-k="line" ${openDetails.has('line')?'open':''}><summary>${T('卡住的時候才打開：你寫的句子','こまったときだけ：自分が書いた文','Only if stuck: your written sentence')}</summary><p><span class="E">${esc(p.line)}</span>${tl(p.line)}</p></details>`:''}
   <h3>${T('用短句講故事（必要時可以逐句解釋）','短い文で説明する（必要なら一文ずつ）','Explain in short, clear sentences')}</h3>${simpleExplain(s.q)}<div class="optional-fu"><b>${T('對方還聽不懂時','まだ伝わらないとき','If someone is still confused')}</b>${SAY('Let me say that in a simpler way.','換簡單的方式解釋','もっと簡単な言い方に変えよう','Try simpler words',['我換簡單的方式說。','もっと簡単に説明しますね。'])}</div>${hostNavigator(s)}<h3>${T('③ 台灣同學的訊號','③ 台湾のみんなからのサイン','③ Signals from Taiwanese students')}</h3>${helpPanel(s)}${B(T('下一步：聽懂了嗎 ▶','次へ：聞き取りチェック ▶','Next: Listening check ▶'),'next','','primary')}`;
  return h;
 }
 const g=s.gs['s'+me];

 h+=g===s.hp
  ?`<h3>${T('🎉 猜對了！','🎉 当たり！','🎉 You got it!')}</h3><p>${T('日本同學可能會問：','日本の生徒はこう聞くかも：','The Japanese student may ask:')}<b class="E">How did you know?</b>${tl('How did you know?')}</p><p class="muted">${T('用下面的句子回答：','下の文で答えよう：','Answer with these:')}</p>${chips(['I guessed it because ___ .','In Taiwan, ___ too.','I heard that ___ .','Just a lucky guess!'],'blank')}`
  :`<h3>${T('猜錯也很好！','外れてもOK！','A wrong guess is great too!')}</h3><p>${T(`你猜的是「${esc(opt(s.q,g).zh)}」。日本同學可能會問：`,`あなたの予想は「${esc(opt(s.q,g).ja)}」。日本の生徒はこう聞くかも：`,`You guessed “${esc(label(s,g))}”. The Japanese student may ask:`)}<b class="E">Why did you think so?</b>${tl('Why did you think so?')}</p>${chips(['I thought ___ because ___ .','In Taiwan, ___ is common.','I didn’t know that!','That’s surprising!'],'blank')}`;

}
function helpPanel(s){
 const e=Object.entries(s.help);
 if(!e.length)return `<p class="muted">${T('還沒有訊號。','まだサインはありません。','No signals yet.')}</p>`;
 return e.map(([k,v])=>`<div class="signal"><b>${tw(+k.slice(1))}：<span class="E">${esc(SIG[v].en)}</span></b>${tl(SIG[v].en)}<small class="ins">${T(SIG[v].hz,SIG[v].ja,SIG[v].he)}</small></div>`).join('')+B(T('清除訊號','サインを消す','Clear signals'),'clearSig');
}
function checkBtns(){
 return `<div class="bar">${Object.entries(SIG).map(([k,v])=>B(T(v.zh,v.jb,v.en),'sig',k,lastCheck===k?'active':'')).join('')}</div>
 ${lastCheck?`<div class="say"><small>${T('請大聲說：','声に出して言おう：','Say it out loud:')}</small><b class="E">${esc(SIG[lastCheck].en)}</b>${tl(SIG[lastCheck].en)}</div>`:''}`;
}
/* 4 聽懂了嗎 */

  <details><summary>${T('選用：原本的聽力小測驗','任意：聞き取りクイズ','Optional original listening quiz')}</summary><p>${T('這個版本將測驗改成選用，優先確認學生是不是真的聽懂，而不是考他們。','クイズは任意です。まず理解できたか確認しましょう。','Quiz is optional. Understanding matters more than scoring.')}</p></details>`;
 }

/* 5 換你說 */

 if(host){
  let h=`${MC([['Now it’s your turn! I want to hear your answers.','現在換你們了！我想聽聽你們的答案。','次はみなさんの番です！みなさんの答えを聞きたいです。'],['I will ask you one by one. Please look at your screen for help.','我會一個一個問。螢幕上有提示可以幫你。','一人ずつ聞きますね。画面にヒントがあります。']])}<h3>${T('台灣同學的答案','台湾のみんなの答え','Taiwanese students’ answers')}</h3><p class="muted">${T('先問答案不一樣的人。點一下就是點名。','違う答えの人から聞こう。タップで指名。','Start with people who chose differently. Tap to pick.')}</p><div class="grid">${ord.map(i=>{const v=s.pk['s'+i];
    return B(`${s.sh['s'+i]?'✓ ':''}<strong>${tw(i)}</strong><small><span class="E">${esc(label(s,v))}</span>${v!=null?TL(esc(opt(s.q,v).zh),esc(opt(s.q,v).ja)):''}</small><small>${v===s.hp?T('相同','同じ','Same'):T('不同','違う','Different')}</small>`,'focus',i,`opt ${s.fc===i?'active':''}`)}).join('')}</div>`;

   else if(v===5)h+=SAY(`${n}, you chose “Something else”. What is it? Tell me!`,'選「其他」的人，問他是什麼','その他を選んだ人。何か聞こう','They chose “Something else”—ask what it is.',[`${n}，你選了「其他」。是什麼？告訴我！`,`${n}、「その他」を選んだね。何？教えて！`]);
   else if(v===6)h+=SAY(`${n}, no experience? That is okay. Have you seen someone else do this?`,'沒有經驗的人，問他為什麼','経験がない人。理由を聞こう','No experience—ask why.',[`${n}，沒有經驗？為什麼？以後想試試看嗎？`,`${n}、経験なし？どうして？いつかやってみたい？`]);
   else h+=SAY(`${n}, you chose “${esc(o.en)}”! Tell me about it.`,'答案不一樣！問清楚一點','違う答え！くわしく聞こう','Different answer! Ask for details.',[`${n}，你選了「${esc(o.zh)}」！說說看。`,`${n}、「${esc(o.ja)}」を選んだね！教えて。`])+more;
   h+=`<b>${T('邊聽邊回應','聞きながらリアクション','React while listening')}</b>${chips(['Really?','Me too!','That’s interesting!','I see.','Wow!','In Japan, ___ .'],'blank')}${B(T('這位結束・下一位 ▶','この人おわり・次の人 ▶','Done · Next person ▶'),'shared','','primary')}`;
  }else h+=`<p class="ok">${T('大家都說完了！','全員話しました！','Everyone has spoken!')}</p>`;
  return h+`${s.q===3?topic4Example(s,true):''}${hostNavigator(s)}<h3>${T('訊號','サイン','Signals')}</h3>${helpPanel(s)}`+B(T('下一步：繼續聊 ▶','次へ：もっと話そう ▶','Next: Keep talking ▶'),'next');
 }
 const v=s.pk['s'+me];

  <p class="muted">${T('想不到要說什麼？可以用 AI 查單字，但要用「說」的告訴對方。','言葉が出てこない？AIで単語を調べてもいいけど、相手には口で伝えよう。','Stuck? You may look up words with AI, but tell your partner by speaking.')}</p>`;}
 const who=s.fc>=0?tw(s.fc):'';
