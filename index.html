const ALL=[...MAIN,...BACKUP,...TEST];
const roomName=id=>({r:'Room ',b:'Backup ',t:'Test '})[id[0]]+id.slice(1);
const slotOf=id=>+id.slice(1)-1;        // Room n、Backup n、Test n 都使用第 n 份答案
const seedOf=id=>+id.slice(1);           // 選項順序也和同號房間一樣

/* ===== 工具 ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function opt(q,i){const a=(i<5?Q[q].o[i]:EXTRA[i-5]).split('|');return{en:a[0],zh:a[1],ja:a[2],w:a[3].split(';'),ask:a[4]}}
function shuffle(arr,seed){const a=arr.slice();let x=seed%2147483647||7;for(let i=a.length-1;i>0;i--){x=(x*16807)%2147483647;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const order=(r,q)=>shuffle([0,1,2,3,4],seedOf(r)*7919+(q+1)*104729).concat([5,6]);
const L=i=>String.fromCharCode(65+i);
const tw=i=>'TW'+(i+1);

const B=(text,act,arg='',cls='',dis=false,cf='')=>`<button class="${cls}" data-act="${act}" data-a="${esc(arg)}" ${cf?`data-cf="${esc(cf)}"`:''} ${dis?'disabled':''}>${text}</button>`;
function copyText(t,msg){const fb=()=>showText(t);try{navigator.clipboard.writeText(t).then(()=>toast(msg||'已複製'),fb)}catch(e){fb()}}

 m.innerHTML=`<div class="mbox"><b>請全選後複製（Ctrl/⌘ + C）</b><textarea readonly>${esc(t)}</textarea><button class="primary" onclick="document.getElementById('modal').remove()">關閉</button></div>`;
 const ta=m.querySelector('textarea');ta.focus();ta.select()}
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}el.textContent=t;el.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',2200)}

function setPath(obj,path,val){const k=path.split('/');let o=obj;for(let i=0;i<k.length-1;i++){if(typeof o[k[i]]!=='object'||o[k[i]]===null)o[k[i]]={};o=o[k[i]]}if(val===null)delete o[k.at(-1)];else o[k.at(-1)]=val}

 rooms=fresh();   // 先讀最新資料再修改，避免多個分頁互相覆蓋

}

/* 座位：不限人數，依進入順序編號；離開的號碼會由新進來的人補上 */
function pickSeat(cur,dev){cur=cur||{};for(const k in cur)if(cur[k]&&cur[k].d===dev){cur[k].on=true;cur[k].t=Date.now();return cur}
 for(let i=0;;i++)if(!cur['s'+i]){cur['s'+i]={d:dev,on:true,t:Date.now()};return cur}}
function seatOf(seats,dev){for(const k in seats||{})if(seats[k]&&seats[k].d===dev)return +k.slice(1);return -1}
let claiming=false;
function claim(r=room,dev=devId()){
 if(claiming)return;claiming=true;me=-1;
 if(db){db.ref(`${BASE}/rooms/${r}/seats`).transaction(cur=>pickSeat(cur,dev)).then(res=>{claiming=false;me=seatOf(res.snapshot.val(),dev);presence();render()});return}
 rooms=fresh();const seats=pickSeat(JSON.parse(JSON.stringify(rooms[r]?.seats||{})),dev);me=seatOf(seats,dev);claiming=false;
 upd({['seats/s'+me]:seats['s'+me]},r);
}
function presence(){
 if(!db||me<0)return;const ref=db.ref(`${BASE}/rooms/${room}/seats/s${me}/on`);
 ref.set(true);ref.onDisconnect().set(false);
}
function online(s,i){const x=s.seats['s'+i];if(!x)return false;if(x.on===false)return false;return db?true:(Date.now()-(x.t||0)<25000)}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

  window.addEventListener('pagehide',()=>{rooms=fresh();if(me>=0&&rooms[room]?.seats?.['s'+me]?.d===devId()){rooms[room].seats['s'+me].on=false;try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}}});}
 if(role==='host'||role==='teacher'||role==='test')setInterval(render,10000);
 render();

}

/* ===== 計算 ===== */
function present(s){return Object.keys(s.seats).filter(k=>s.seats[k]).map(k=>+k.slice(1)).sort((a,b)=>a-b)}
function majority(s){const c={};present(s).forEach(i=>{const v=s.pk['s'+i];if(v!=null)c[v]=(c[v]||0)+1});const m=Math.max(0,...Object.values(c));return m?Object.keys(c).filter(k=>c[k]===m).map(Number):[]}
function shareOrder(s){return present(s).sort((a,b)=>Number(s.pk['s'+a]===s.hp)-Number(s.pk['s'+b]===s.hp))}
function quizOf(r,q){const p=preset(r,q);if(!p||!p.quiz)return null;const opts=shuffle([0,1,2,3],(seedOf(r)+3)*31+q*17);return{q:p.quiz[0],o:opts.map(i=>p.quiz[i+1]),a:opts.indexOf(0)}}

const ACT={
 go:a=>{const[r,ro]=a.split(',');go(r,ro)},

   const o={};['seats','pk','gs','qz','sh','help'].forEach(k=>o[`${k}/s${i}`]=null);if(s.rt===+i)o.rt=-1;if(s.fc===+i)o.fc=-1;upd(o,r)},
 live:()=>upd({live:true}),
 start:a=>{const q=+a,p=preset(room,q);upd({tv:null,und:null,ex:-1,ao:-1,aqi:-1,asked:null,q,p:1,hp:p?p.pick:-1,hg:-1,pk:null,gs:null,help:null,rt:-1,rtok:'',qzOn:false,qz:null,fc:-1,sh:null,turn:0,card:'',used:null,rounds:0})},

 next:()=>{const s=S();upd({p:s.p+1,ao:-1,aqi:-1})},

 rtok:a=>upd({rtok:a}),
 quizOn:()=>upd({qzOn:true}),
 quiz:a=>upd({['qz/s'+me]:+a}),
 focus:a=>upd({fc:+a}),
 shared:()=>{const s=S();const sh={...s.sh,['s'+s.fc]:true};const nx=shareOrder(s).find(i=>!sh['s'+i]);upd({['sh/s'+s.fc]:true,fc:nx??-1})},

   let i=deck.findIndex((_,k)=>!s.used[pref+k]);if(i<0)i=Math.floor(Math.random()*deck.length);upd({card:deck[i],['used/'+pref+i]:true})},

 finish:()=>{const s=S();upd({['done/q'+s.q]:true,q:-1,p:0,tv:null})},

   wipe(ids);toast(`已重置${nm}`)},
 goHome:()=>go(room,'home'),
 copy:a=>copyText(a,'已複製連結')
};

let personas=[], inPersona=false, pendingRender=false;
function withPersona(p,fn){
 const sv=[role,me,lastCheck];role=p.role;me=p.me??-1;lastCheck=p.lc||null;inPersona=true;
 let out;try{out=fn()}finally{p.lc=lastCheck;role=sv[0];me=sv[1];lastCheck=sv[2];inPersona=false}
 if(pendingRender){pendingRender=false;render()}
 return out;
}

 if(!FIREBASE_CONFIG)setInterval(()=>{rooms=fresh();let ch=false;personas.forEach(p=>{const x=p.role==='tw'&&p.me>=0&&rooms[room]?.seats?.['s'+p.me];if(x&&x.d===p.dev){x.t=Date.now();x.on=true;ch=true}});if(ch)saveLocal()},8000);

 personas.forEach((p,idx)=>{if(p.role!=='tw'||p.me<0||idx<2)return;const k='s'+p.me;
  const rnd=()=>order(room,s.q)[Math.floor(Math.random()*7)];

 let h;
 if(host)h=`<div class="say"><b class="E">Which topic do you want to talk about first?</b>${tl('Which topic do you want to talk about first?')}
   <small class="ins">${T('問問大家，一起討論決定。決定後按那一題的「就這題」。','みんなに聞いて、話し合って決めよう。決まったらその話題の「これにする」を押してね。','Ask everyone and decide together. Then press “This one” on that topic.')}</small></div>
  ${MC([['Please look at your screen. Scroll down, and you can see ten topics.','請看你們的螢幕。往下滑，就可以看到十個題目。','画面を見てください。下にスクロールすると、10個の話題が見えます。'],['Which topic do you want to talk about first? Let’s decide together!','你們想先聊哪一題？我們一起決定吧！','どの話題から話したいですか？一緒に決めましょう！']])}
  ${chips(['Which topic do you like?','Why?','Me too!','Let’s talk about number ___ !'],'blank')}
  <div class="decide"><div><b>${T('決定不了的時候…','決まらないときは…','If no one can decide…')}</b>${SAY(`It’s hard to decide, right? If we can’t decide, let’s start from number ${nio+1}. Is that OK?`,'沒人決定的時候，溫和地提議照順序','誰も決められないときは、やさしく「順番どおり」を提案しよう','If no one decides, gently suggest going in order',[`很難決定對吧？如果決定不了，我們就從第 ${nio+1} 題開始，好嗎？`,`決めるのは難しいよね。決められなかったら、${nio+1}番から始めようか。いいですか？`])}</div>
   ${B(T(`照順序：No.${nio+1} ▶`,`順番どおり：No.${nio+1} ▶`,`In order: No.${nio+1} ▶`),'start',nio,'primary')}</div>`;
 else h=`<div class="say"><b class="E">Which topic do you want to talk about?</b>${tl('Which topic do you want to talk about?')}
   <small class="ins">${T('用說的告訴日本同學你最想先聊哪一題，大家一起討論。決定不了的話，就請日本同學照順序。','どの話題を先に話したいか、日本の生徒に口で伝えよう。決まらなければ、順番どおりにしてもらおう。','Tell the Japanese student which topic you want to talk about first. If you can’t decide, ask to go in order.')}</small></div>
  ${SCROLL()}${chips(['I want to talk about number ___ .','Number ___ looks fun!','How about number ___ ?','Me too!','I don’t mind. Let’s go in order.'],'blank')}`;
 return h+`<div class="topics">${Q.map(card).join('')}</div>`;
}

   ${s.rtok==='again'?`<p class="muted">${T('再說一次，短一點、慢一點。之後也可以再點一位。','もう一度、短く、ゆっくり話そう。そのあと、もう一人指名してもOK。','Say it again—shorter and slower. You can pick another person after.')}</p>`:''}`;
  if(qz){h+=`<h3>${T('小測驗（會出現在所有台灣同學畫面）','クイズ（台湾全員の画面に出ます）','Quiz (shown on all Taiwanese screens)')}</h3>`+(s.qzOn
    ?`<p><span class="E">${esc(qz.q)}</span>${tl(qz.q)}</p><p>${present(s).map(i=>{const v=s.qz['s'+i];return `${tw(i)} ${v==null?'…':v===qz.a?'<span class="ok">✓</span>':'<span class="ng">✗</span>'}`}).join('　')}</p><p class="muted">${T('有人答錯的話，再說明一次。','✗の人がいたら、もう一度説明しよう。','If anyone got ✗, explain again.')}</p>`
    :B(T('出題','クイズを出す','Start quiz'),'quizOn'))}
  return h+`<h3>${T('訊號','サイン','Signals')}</h3>${helpPanel(s)}`+B(T('下一步：繼續聊 ▶','次へ：もっと話そう ▶','Next: Keep talking ▶'),'next','','primary');
 }
 let h='';
 if(s.rt===me)h+=`<h3>${T('🎤 換你！用一句話說出日本同學剛剛說的內容','🎤 あなたの番！日本の生徒が話したことを一文で言おう','🎤 Your turn! Say what the Japanese student said in one sentence')}</h3>${chips(['So, in Japan, ___ .','You said ___ .','Is that right?'],'blank')}<b>${T('提示字','ヒント','Hints')}</b>${chips(ans.w)}`;
 else if(s.rt>=0)h+=`<h3>${T(`👂 聽 ${tw(s.rt)} 說`,`👂 ${tw(s.rt)} の話を聞こう`,`👂 Listen to ${tw(s.rt)}`)}</h3><p class="muted">${T(`${tw(s.rt)} 卡住的話，可以幫忙補一個字。`,`${tw(s.rt)} が困ったら、一言助けてあげよう。`,`If ${tw(s.rt)} gets stuck, help with a word.`)}</p>`;
 else h+=`<h3>${T('等日本同學點人…','日本の生徒が指名するのを待とう…','Waiting for the host to pick someone…')}</h3><p class="muted">${T('可能會點到你喔！先想想剛剛聽到了什麼。','あなたかも！聞いたことを思い出そう。','It might be you! Think about what you heard.')}</p>`;
 if(s.rt>=0&&s.rtok)h+=`<p>${s.rtok==='ok'?`<span class="ok">👍 That’s right!</span>${tl('That’s right! 👍')}`:`<span class="ng">${T('日本同學會再說一次，仔細聽！','もう一度話してくれるよ。よく聞こう！','The host will say it again—listen carefully!')}</span>`}</p>`;
 if(qz&&s.qzOn){const v=s.qz['s'+me];
  h+=`<h3>${T('小測驗：','クイズ：','Quiz:')} <span class="E">${esc(qz.q)}</span>${tl(qz.q)}</h3><div class="grid">${qz.o.map((o,i)=>B(`<span class="E">${esc(o)}</span>`+tl(o),'quiz',i,`opt ${v===i?(i===qz.a?'right':'active'):''}`,v!=null)).join('')}</div>`;
  if(v!=null)h+=v===qz.a?`<p class="ok">${T('✓ 答對了！','✓ 正解！','✓ Correct!')}</p>`:`<div class="say"><small>${T('答錯了沒關係，請大聲問：','まちがえても大丈夫。声に出して聞こう：','That’s OK! Ask out loud:')}</small><b class="E">Could you say that part again, please?</b>${tl('Could you say that part again, please?')}</div>`;}
 return h+`<h3>${T('聽不懂？','わからない？','Didn’t understand?')}</h3>${checkBtns()}`;
}
/* 5 換你說 */
function p5(s,q,host){
 const ord=shareOrder(s);
 if(host){
  let h=`${MC([['Now it’s your turn! I want to hear your answers.','現在換你們了！我想聽聽你們的答案。','次はみなさんの番です！みなさんの答えを聞きたいです。'],['I will ask you one by one. Please look at your screen for help.','我會一個一個問。螢幕上有提示可以幫你。','一人ずつ聞きますね。画面にヒントがあります。']])}<h3>${T('台灣同學的答案','台湾のみんなの答え','Taiwanese students’ answers')}</h3><p class="muted">${T('先問答案不一樣的人。點一下就是點名。','違う答えの人から聞こう。タップで指名。','Start with people who chose differently. Tap to pick.')}</p><div class="grid">${ord.map(i=>{const v=s.pk['s'+i];
    return B(`${s.sh['s'+i]?'✓ ':''}<strong>${tw(i)}</strong><small><span class="E">${esc(label(s,v))}</span>${v!=null?TL(esc(opt(s.q,v).zh),esc(opt(s.q,v).ja)):''}</small><small>${v===s.hp?T('相同','同じ','Same'):T('不同','違う','Different')}</small>`,'focus',i,`opt ${s.fc===i?'active':''}`)}).join('')}</div>`;
  if(s.fc>=0){const v=s.pk['s'+s.fc],o=v!=null?opt(s.q,v):null,n=tw(s.fc);
   h+=`<h3>${T(`問 ${n}`,`${n} に聞こう`,`Ask ${n}`)}</h3>`;
   const more=o?SAY(esc(o.ask),'想再問一題的話','もう一つ聞くなら','One more question',tr(o.ask)):'';
   if(v==null)h+=SAY(`${n}, what do you think?`,'問他的想法','考えを聞こう','Ask what they think.',[`${n}，你覺得呢？`,`${n}はどう思う？`]);
   else if(v===s.hp)h+=SAY(`${n}, we chose the same answer! Why did you choose it?`,'答案一樣！問他理由','同じ答え！理由を聞こう','Same answer! Ask why.',[`${n}，我們選的一樣！你為什麼選這個？`,`${n}、同じ答えだね！どうしてそれを選んだの？`])+more;
   else if(v===5)h+=SAY(`${n}, you chose “Something else”. What is it? Tell me!`,'選「其他」的人，問他是什麼','その他を選んだ人。何か聞こう','They chose “Something else”—ask what it is.',[`${n}，你選了「其他」。是什麼？告訴我！`,`${n}、「その他」を選んだね。何？教えて！`]);
   else if(v===6)h+=SAY(`${n}, no experience? Why not? Would you like to try it someday?`,'沒有經驗的人，問他為什麼','経験がない人。理由を聞こう','No experience—ask why.',[`${n}，沒有經驗？為什麼？以後想試試看嗎？`,`${n}、経験なし？どうして？いつかやってみたい？`]);
   else h+=SAY(`${n}, you chose “${esc(o.en)}”! Tell me about it.`,'答案不一樣！問清楚一點','違う答え！くわしく聞こう','Different answer! Ask for details.',[`${n}，你選了「${esc(o.zh)}」！說說看。`,`${n}、「${esc(o.ja)}」を選んだね！教えて。`])+more;
   h+=`<b>${T('邊聽邊回應','聞きながらリアクション','React while listening')}</b>${chips(['Really?','Me too!','That’s interesting!','I see.','Wow!','In Japan, ___ .'],'blank')}${B(T('這位結束・下一位 ▶','この人おわり・次の人 ▶','Done · Next person ▶'),'shared','','primary')}`;
  }else h+=`<p class="ok">${T('大家都說完了！','全員話しました！','Everyone has spoken!')}</p>`;
  return h+`<h3>${T('訊號','サイン','Signals')}</h3>${helpPanel(s)}`+B(T('下一步：繼續聊 ▶','次へ：もっと話そう ▶','Next: Keep talking ▶'),'next');
 }
 const v=s.pk['s'+me];
 if(s.fc===me&&v!=null){const o=opt(s.q,v);
  return `<h3>${T('🎤 換你說！','🎤 あなたの番！','🎤 Your turn!')}</h3><div class="big"><div class="tag">${T('你選的是','あなたが選んだ答え','You chose')}</div><h2 class="E">${esc(o.en)}</h2><p class="muted tri3 qsub">${T(esc(o.zh),esc(o.ja))}</p></div>
  <b>${T('句子開頭','文の始め方','Sentence starters')}</b>${chips(v===5?['My answer is ___ .','It is ___ .','For example, ___ .','In Taiwan, ___ .']:v===6?['I have never ___ .','Because ___ .','Maybe someday, I want to ___ .']:[[`I chose “${o.en}” because ___ .`,`我選「${o.zh}」，因為 ___。`,`「${o.ja}」を選びました。なぜなら___からです。`],'For example, ___ .','In Taiwan, ___ .','In my family, ___ .'],'blank')}
  <b>${T('提示字','ヒント','Hints')}</b>${chips(o.w)}
  <h3>${T('說完後，反問日本同學 🔁','話したら、日本の生徒に聞き返そう 🔁','Then ask the Japanese student back 🔁')}</h3>${chips(v===5?['What about you?','Is it the same in Japan?']:v===6?['What about you?','Have you ever ___ ?']:['What about you?','Is it the same in Japan?',[`Do you have ${o.w[0]} in Japan?`,`日本也有「${(tr(o.w[0])||[o.w[0]])[0]}」嗎？`,`日本にも「${(tr(o.w[0])||[,o.w[0]])[1]}」はありますか？`]],'blank')}
  <p class="muted">${T('想不到要說什麼？可以用 AI 查單字，但要用「說」的告訴對方。','言葉が出てこない？AIで単語を調べてもいいけど、相手には口で伝えよう。','Stuck? You may look up words with AI, but tell your partner by speaking.')}</p>`;}
 const who=s.fc>=0?tw(s.fc):'';
 return `<h3>${who?T(`👂 聽 ${who} 說`,`👂 ${who} の話を聞こう`,`👂 Listen to ${who}`):T('等日本同學點人…','日本の生徒が指名するのを待とう…','Waiting for the host to pick someone…')}</h3>
  <p class="muted">${T(`你選的是「${v!=null?esc(opt(s.q,v).zh):'—'}」。被點到時要說說為什麼。`,`あなたの答えは「${v!=null?esc(opt(s.q,v).ja):'—'}」。指名されたら理由を話そう。`,`You chose “${esc(label(s,v))}”. Explain why when you’re picked.`)}</p>
  <b>${T('別人說的時候，可以加一句','ほかの人が話しているとき、一言そえよう','Add a line while others talk')}</b>${chips(['Me too!','Really?','In my case, ___ .','I chose ___ because ___ .'],'blank')}${checkBtns()}`;
}
/* 6 繼續聊 */
function p6(s,q,host){
 const pr=present(s),t=s.turn%(pr.length+1),holder=t===0?'host':'s'+pr[t-1],mine=host?holder==='host':holder==='s'+me;
 const name=t===0?'🇯🇵 Host':'🇹🇼 '+tw(pr[t-1]);
 let h=`<div class="bar" style="justify-content:space-between"><h3>${T('💬 輪流問問題','💬 順番に質問','💬 Take turns asking')}</h3><span class="tag">${T(`第 ${s.rounds} 回合`,`${s.rounds} ラウンド`,`rounds ${s.rounds}`)}</span></div>
  <p>${T('現在輪到：','今の番：','Now:')}<b>${name}</b></p>`;
 if(host)h=MC([['Let’s talk more! We will take turns asking questions.','我們再多聊一點！大家輪流問問題。','もっと話しましょう！順番に質問します。'],['When it’s your turn, tap the button and ask the question on the card.','輪到你的時候，按按鈕，問卡片上的問題。','自分の番になったら、ボタンを押してカードの質問をしてね。']])+h;
 if(s.card)h+=`<div class="card"><small>${esc(name)} ${T('問：','の質問：','asks:')}</small><span class="E">${esc(s.card)}</span>${tl(s.card)}</div>`;
 if(mine){
  h+=s.card?`<p>${T('↑ 大聲把這個問題問出來，聽完回應一句！','↑ 声に出して質問しよう。答えを聞いたらリアクション！','↑ Ask this out loud, then react to the answer!')}</p>${chips(['Really?','Me too!','That’s interesting!','Why?'],'blank')}${B(T('換下一個人 ▶','次の人へ ▶','Next person ▶'),'pass','','primary')}`
   :B(T('🎴 抽一張問題卡','🎴 カードを引く','🎴 Draw a card'),'draw','','primary');
 }else{
  h+=s.card?`<p>${T('↓ 用這些句子回答','↓ このヒントを使って答えよう','↓ Answer with these')}</p>${chips(host?['In Japan, ___ .','In my case, ___ .','For example, ___ .','What about you?']:['In Taiwan, ___ .','In my case, ___ .','For example, ___ .','What about you?'],'blank')}`
   :`<p class="muted">${T('等對方抽卡…','カードを引くのを待っています…','Waiting for a card…')}</p>`;
 }
 if(host)h+=`<p class="muted">${T('聊得起來的話，不抽卡也可以，自由聊！','話が続いたら、カードは引かなくてもOK。自由に話そう。','If the conversation flows, no need to draw—just talk!')}</p>`+B(T('跳過，下一個人','次の人へ（スキップ）','Skip to next person'),'pass')
  +`<h3>${T('要結束這一題時','この話題を終えるとき','When you finish this topic')}</h3>`+MC([['Thank you, everyone! That was fun. Let’s choose the next topic!','謝謝大家！很好玩。我們來選下一題吧！','みなさん、ありがとう！楽しかったです。次の話題を選びましょう！']])+B(T('結束這題，選下一題 ▶','この話題を終えて、次を選ぶ ▶','Finish and choose the next topic ▶'),'finish','','primary');
 return h;
}
applyLang();
document.querySelectorAll('.hv').forEach(e=>e.textContent='version '+VERSION);
init();
</script>
